name: linuxserver-krita
services:
  app:
    image: linuxserver/krita:5.3.3@sha256:c55c759952e60a9e33367180e3ebf2fcb5215ea47e9c9788490c0b0467ce51d0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverkrita/assets/icon.png
  title:
    en_US: Krita (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverkrita
  version: "5.3.3"
  port_map: '3000'
