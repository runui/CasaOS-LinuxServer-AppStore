name: linuxserver-readme-sync
services:
  app:
    image: linuxserver/readme-sync:84f2d0c3-ls27@sha256:24030eb9cbb824dd5334c5d9cee521049833514f9e12577c576fd28f1afd32a8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/readme-sync/config
        target: /config
x-casaos:
  id: wisdomsky.linuxserver.linuxserverreadmesync
  version: "0.0.1"
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverreadmesync/assets/icon.png
  title:
    en_US: Readme sync
  port_map: '80'
