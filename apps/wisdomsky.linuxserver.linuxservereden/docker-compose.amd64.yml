name: linuxserver-eden
services:
  app:
    image: linuxserver/eden:0.2.1@sha256:031f70a42e0929968aef6a4c501d58166f56b881477071c2c21c18606993fe2d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservereden/assets/icon.png
  title:
    en_US: Eden (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservereden
  version: "0.2.1"
  port_map: '3000'
