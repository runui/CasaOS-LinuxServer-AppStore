name: linuxserver-boinc
services:
  app:
    image: linuxserver/boinc:8.2.8@sha256:c17805dfaa55872507ed5b71ad233941a0faf93acc9377c286a0160364b8c590
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 8181
        published: 8181
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/boinc/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverboinc/assets/icon.jpg
  title:
    en_US: Boinc (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverboinc
  version: "8.2.8"
  port_map: '8080'
