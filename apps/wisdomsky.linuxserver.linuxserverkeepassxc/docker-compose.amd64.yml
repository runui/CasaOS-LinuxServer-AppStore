name: linuxserver-keepassxc
services:
  app:
    image: linuxserver/keepassxc:2.7.12@sha256:0edfb54b7a9dcacad5c430cdb7a9ff20577c8c155170b26c0da57369e44cc91d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverkeepassxc/assets/icon.png
  title:
    en_US: Keepassxc (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverkeepassxc
  version: "2.7.12"
  port_map: '3000'
