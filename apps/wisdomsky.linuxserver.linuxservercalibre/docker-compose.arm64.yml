name: linuxserver-calibre
services:
  app:
    image: linuxserver/calibre:9.14.0@sha256:b7833b03726847dc0f040172ef9e69a79d7e056bd62d840e5ac631748b7ac84d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CLI_ARGS: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 8181
        published: 8181
        protocol: tcp
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calibre/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercalibre/assets/icon.png
  title:
    en_US: Calibre (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercalibre
  version: "9.14.0"
  port_map: '8080'
