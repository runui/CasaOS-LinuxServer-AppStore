name: linuxserver-ardour
services:
  app:
    image: linuxserver/ardour:version-2026-06-19
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ardour/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverardour/assets/icon.png
  title:
    en_US: Ardour (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverardour
  version: "2026.6.19"
  port_map: '3000'
