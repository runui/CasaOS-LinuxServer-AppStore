name: linuxserver-steam
services:
  app:
    image: linuxserver/steam:version-0779c5e2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/steam/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserversteam/assets/icon.png
  title:
    en_US: Steam (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserversteam
  version: "0.0.1"
  port_map: '3000'
