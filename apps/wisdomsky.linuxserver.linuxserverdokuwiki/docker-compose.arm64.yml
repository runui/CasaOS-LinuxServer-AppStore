name: linuxserver-dokuwiki
services:
  app:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:fbae68155dd7d200b1d5e183617e6f88560178eae44a2fa3ae7e1f9f5231d9a9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverdokuwiki/assets/icon.png
  title:
    en_US: Dokuwiki (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverdokuwiki
  version: "2026.7.14-c"
  port_map: '80'
