name: linuxserver-wps-office
services:
  app:
    image: linuxserver/wps-office:11.1.0@sha256:649f8919f23ae800022b890bfa51a8abb28fff9c92f9ac590f0a64e5f25a1b41
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverwpsoffice/assets/icon.png
  title:
    en_US: Wps office (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverwpsoffice
  version: "11.1.0"
  port_map: '3000'
