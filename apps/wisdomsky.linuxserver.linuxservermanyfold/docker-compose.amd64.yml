name: linuxserver-manyfold
services:
  app:
    image: linuxserver/manyfold:0.149.0@sha256:9bf278f9cb56b06e6d5d1f8a3178e369a0a4e443381d7f47f964a3369832205d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DATABASE_URL: ''
      REDIS_URL: ''
      SECRET_KEY_BASE: ''
    ports:
      - target: 3214
        published: 3214
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/manyfold/config
        target: /config
      - type: bind
        source: /DATA/AppData/manyfold/libraries
        target: /libraries
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservermanyfold/assets/icon.png
  title:
    en_US: Manyfold (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservermanyfold
  version: "0.148.0"
  port_map: '3214'
