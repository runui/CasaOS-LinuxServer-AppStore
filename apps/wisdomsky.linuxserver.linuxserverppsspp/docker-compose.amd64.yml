name: linuxserver-ppsspp
services:
  app:
    image: linuxserver/ppsspp:1.20.4@sha256:e540d40cc254c4b3437a14dbf833f09dc843adabe5f943efbf48c67e399f94cc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverppsspp/assets/icon.png
  title:
    en_US: Ppsspp (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverppsspp
  version: "1.20.4"
  port_map: '3000'
