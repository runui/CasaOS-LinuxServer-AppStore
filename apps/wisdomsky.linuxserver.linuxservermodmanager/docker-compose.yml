name: linuxserver-modmanager
services:
  app:
    image: linuxserver/modmanager:version-7dc8618e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modmanager/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservermodmanager/assets/icon.png
  title:
    en_US: Modmanager (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservermodmanager
  version: "0.0.1"
  port_map: '80'
