name: linuxserver-cops
services:
  app:
    image: linuxserver/cops:4.5.2@sha256:5c9b58a9460ef53b6acb7e5d713fc8d59bff8d7095545cbb58d802ebdb0f2e79
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercops/assets/icon.png
  title:
    en_US: Cops (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercops
  version: "4.5.2"
  port_map: '80'
