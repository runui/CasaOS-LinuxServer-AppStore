name: linuxserver-wireshark
services:
  app:
    image: linuxserver/wireshark:4.6.6@sha256:8446182cc85e721a7039b1729f21556a09e7497fe8d46801e42a6ac9ce6e3318
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverwireshark/assets/icon.png
  title:
    en_US: Wireshark (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverwireshark
  version: "4.6.6"
  port_map: '80'
