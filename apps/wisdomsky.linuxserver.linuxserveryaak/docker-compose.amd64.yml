name: linuxserver-yaak
services:
  app:
    image: linuxserver/yaak:2026.7.1@sha256:5f376c542a207e5443d0b569156eba008b3f1d8e906690288677c1b7a171442e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserveryaak/assets/icon.png
  title:
    en_US: Yaak (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserveryaak
  version: "2026.7.1"
  port_map: '3000'
