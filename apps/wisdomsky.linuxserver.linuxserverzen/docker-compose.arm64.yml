name: linuxserver-zen
services:
  app:
    image: linuxserver/zen:1.21.16@sha256:62fbe0c4282e57553637a4543e78d3e7be5fa20e6ef9e12b554b700874bfba6c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverzen/assets/icon.png
  title:
    en_US: Zen (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverzen
  version: "1.21.16"
  port_map: '3000'
