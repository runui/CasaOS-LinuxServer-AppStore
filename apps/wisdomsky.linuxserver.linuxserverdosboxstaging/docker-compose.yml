name: linuxserver-dosbox-staging
services:
  app:
    image: linuxserver/dosbox-staging:0.83.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dosbox-staging/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverdosboxstaging/assets/icon.png
  title:
    en_US: Dosbox staging (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverdosboxstaging
  version: "0.83.0"
  port_map: '3000'
