name: linuxserver-mariadb
services:
  app:
    image: linuxserver/mariadb:11.8.8@sha256:1071baf9bd3afbb3c98ab36dbe59a19dbe6c9c92e3d00599579035db963a4aaf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: ''
      MYSQL_USER: ''
      MYSQL_PASSWORD: ''
      REMOTE_SQL: ''
      CLI_OPTS: ''
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mariadb/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservermariadb/assets/icon.png
  title:
    en_US: Mariadb (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservermariadb
  version: "11.8.8"
  port_map: '3306'
