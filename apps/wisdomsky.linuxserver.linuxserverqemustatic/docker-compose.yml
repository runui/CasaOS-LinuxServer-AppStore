name: linuxserver-qemu-static
services:
  app:
    image: linuxserver/qemu-static:10.0.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qemu-static/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverqemustatic/assets/icon.png
  title:
    en_US: Qemu static (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverqemustatic
  version: "10.0.2"
  port_map: '80'
