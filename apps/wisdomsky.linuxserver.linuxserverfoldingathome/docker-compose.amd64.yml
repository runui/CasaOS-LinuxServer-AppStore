name: linuxserver-foldingathome
services:
  app:
    image: linuxserver/foldingathome:8.5.6@sha256:6fd752f28205db22c80cd20be02d214ef32624a83d7da0152a1a962e8245764a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 7396
        published: 7396
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverfoldingathome/assets/icon.svg
  title:
    en_US: Foldingathome (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverfoldingathome
  version: "8.5.6"
  port_map: '80'
