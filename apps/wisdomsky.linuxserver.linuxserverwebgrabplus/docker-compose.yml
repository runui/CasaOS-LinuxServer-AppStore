name: linuxserver-webgrabplus
services:
  app:
    image: linuxserver/webgrabplus:5.6.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverwebgrabplus/assets/icon.jpg
  title:
    en_US: Webgrabplus (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverwebgrabplus
  version: "5.6.1"
  port_map: '80'
