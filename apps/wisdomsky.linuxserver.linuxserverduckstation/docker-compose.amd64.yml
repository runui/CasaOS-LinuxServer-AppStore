name: linuxserver-duckstation
services:
  app:
    image: linuxserver/duckstation:version-latest@sha256:341056987488b34bee22eb7642bd0b5302c54c2e7f6623e557ed6278b93c5f24
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/duckstation/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverduckstation/assets/icon.png
  title:
    en_US: Duckstation (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverduckstation
  version: "0.0.1"
  port_map: '3000'
