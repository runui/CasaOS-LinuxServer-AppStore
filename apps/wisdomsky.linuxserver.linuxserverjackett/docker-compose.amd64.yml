name: linuxserver-jackett
services:
  app:
    image: linuxserver/jackett:0.24.2572@sha256:9137e89bf4040cc96bb0e2ff3b1c91f9d36755f59bdee882cbac3e9293d02425
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      AUTO_UPDATE: ''
      RUN_OPTS: ''
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/jackett/config
        target: /config
      - type: bind
        source: /DATA/AppData/jackett/downloads
        target: /downloads
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverjackett/assets/icon.png
  title:
    en_US: Jackett (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverjackett
  version: "0.24.2544"
  port_map: '9117'
