name: linuxserver-homeassistant
services:
  app:
    image: linuxserver/homeassistant:2026.9.2@sha256:c53fce01723719e1b1e69dcc7317b1efc2eb9b9a13f5a2753acc43ffde1060ff
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/homeassistant/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverhomeassistant/assets/icon.png
  title:
    en_US: Homeassistant (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverhomeassistant
  version: "2026.9.1"
  port_map: '8123'
