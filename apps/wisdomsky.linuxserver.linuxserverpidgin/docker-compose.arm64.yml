name: linuxserver-pidgin
services:
  app:
    image: linuxserver/pidgin:2.14.14@sha256:1bc20aa97c79127280b28bf1005bb78fd647539aca773540ce22a6dd527599bc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverpidgin/assets/icon.png
  title:
    en_US: Pidgin (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverpidgin
  version: "2.14.14"
  port_map: '3000'
