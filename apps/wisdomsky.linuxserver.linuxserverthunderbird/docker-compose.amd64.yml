name: linuxserver-thunderbird
services:
  app:
    image: linuxserver/thunderbird:1140.15.0@sha256:95ef8c66be90673edfa017355d6f0d5ae6c0dcacf878afb3d0b805468c99eb07
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverthunderbird/assets/icon.png
  title:
    en_US: Thunderbird (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverthunderbird
  version: "1140.15.0"
  port_map: '3000'
