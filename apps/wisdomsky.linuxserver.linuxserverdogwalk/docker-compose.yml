name: linuxserver-dogwalk
services:
  app:
    image: linuxserver/dogwalk:version-b93769c4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dogwalk/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverdogwalk/assets/icon.png
  title:
    en_US: Dogwalk (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverdogwalk
  version: "0.0.1"
  port_map: '3000'
