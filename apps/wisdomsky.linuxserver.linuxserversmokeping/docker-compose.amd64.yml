name: linuxserver-smokeping
services:
  app:
    image: linuxserver/smokeping:2.9.0@sha256:1ccd2a6c8fe78227d163b111ab3bfce3420ca7c2f669d9741c63023148659af4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MASTER_URL: ''
      SHARED_SECRET: ''
      CACHE_DIR: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/smokeping/config
        target: /config
      - type: bind
        source: /DATA/AppData/smokeping/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserversmokeping/assets/icon.png
  title:
    en_US: Smokeping (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserversmokeping
  version: "2.9.0"
  port_map: '80'
