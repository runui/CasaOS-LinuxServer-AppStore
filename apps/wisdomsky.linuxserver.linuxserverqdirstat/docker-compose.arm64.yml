name: linuxserver-qdirstat
services:
  app:
    image: linuxserver/qdirstat:2.0.20260906@sha256:50a91f9c50811924452071b8068270ccd7628db06bc2230b6a7cf35341fb7e98
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverqdirstat/assets/icon.png
  title:
    en_US: Qdirstat (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverqdirstat
  version: "2.0.20260906"
  port_map: '3000'
