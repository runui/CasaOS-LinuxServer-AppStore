name: linuxserver-heimdall
services:
  app:
    image: linuxserver/heimdall:2.8.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverheimdall/assets/icon.png
  title:
    en_US: Heimdall (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverheimdall
  version: "2.8.3"
  port_map: '80'
