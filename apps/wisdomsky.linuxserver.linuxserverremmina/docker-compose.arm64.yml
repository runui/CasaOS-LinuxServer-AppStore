name: linuxserver-remmina
services:
  app:
    image: linuxserver/remmina:1.4.43@sha256:454cf0540eccb44053aad24474ab1dce7de7ae5bcdcb408cf326feb51ae42127
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverremmina/assets/icon.png
  title:
    en_US: Remmina (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverremmina
  version: "1.4.43"
  port_map: '3000'
