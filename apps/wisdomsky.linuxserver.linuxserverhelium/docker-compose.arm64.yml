name: linuxserver-helium
services:
  app:
    image: linuxserver/helium:0.17.0@sha256:8391855f51317f42b624a121dd30f0749b37bd750df4491638db3e889348e2ca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverhelium/assets/icon.png
  title:
    en_US: Helium (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverhelium
  version: "0.16.5"
  port_map: '3000'
