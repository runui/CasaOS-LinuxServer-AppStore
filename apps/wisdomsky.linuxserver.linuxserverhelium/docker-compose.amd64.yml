name: linuxserver-helium
services:
  app:
    image: linuxserver/helium:0.17.0@sha256:d5bd202e6d46941d1fe44d241878cb0a9c646ed6856056c341b2f06299d768a4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverhelium/assets/icon.png
  title:
    en_US: Helium (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverhelium
  version: "0.16.5"
  port_map: '3000'
