name: linuxserver-znc
services:
  app:
    image: linuxserver/znc:1.10.2@sha256:c308a6ef441a00553c692d7e2e39dde6fe51de7ca3b46b8c33d1b54545e73d6e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6501
        published: 6501
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverznc/assets/icon.png
  title:
    en_US: Znc (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverznc
  version: "1.10.2"
  port_map: '6501'
