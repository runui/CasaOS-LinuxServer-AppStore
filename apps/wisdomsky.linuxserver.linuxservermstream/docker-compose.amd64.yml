name: linuxserver-mstream
services:
  app:
    image: linuxserver/mstream:6.26.0@sha256:b821f714c4159889ee1922d602340d55c071cd7e179e3f9bec540285e20ecb76
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mstream/config
        target: /config
      - type: bind
        source: /DATA/AppData/mstream/music
        target: /music
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservermstream/assets/icon.png
  title:
    en_US: Mstream (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservermstream
  version: "6.25.0"
  port_map: '3000'
