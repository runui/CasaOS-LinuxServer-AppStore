name: linuxserver-filezilla
services:
  app:
    image: linuxserver/filezilla:3.69.6@sha256:dc2e5760bb42fd5820737988d177b39c0f500b526bf1a85aefbe34276ecc7c9e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/filezilla/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverfilezilla/assets/icon.png
  title:
    en_US: Filezilla (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverfilezilla
  version: "3.69.6"
  port_map: '3000'
