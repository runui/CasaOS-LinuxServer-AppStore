name: linuxserver-resilio-sync
services:
  app:
    image: linuxserver/resilio-sync:3.1.2@sha256:26a67ef5df924556eb662cc6cf3902f8597058da23130b5bf9d33acbb840ed62
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
      - target: 55555
        published: 55555
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/resilio-sync/config
        target: /config
      - type: bind
        source: /DATA/AppData/resilio-sync/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/resilio-sync/sync
        target: /sync
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/runui/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverresiliosync/assets/icon.png
  title:
    en_US: Resilio sync (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverresiliosync
  version: "3.1.2"
